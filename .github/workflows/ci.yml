name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      # Run from backend/ so pyproject's pythonpath applies and `import app` resolves.
      - name: Unit tests
        run: python -m pytest -q -m unit

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Application import smoke test
        run: python -c "from app.main import app; print(app.title, app.version)"
      # Offline suite: SQLite, hashing embeddings, injected fake LLM. No Groq key needed.
      - name: Integration tests
        run: python -m pytest -q -m integration

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests
        run: npm run test
      - name: Production build
        run: npm run build

  docker-api:
    name: Docker backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-lint, backend-unit, backend-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t insurio-api:ci ./backend
      - name: Verify image imports app and applies migrations
        run: |
          docker run --rm insurio-api:ci python -c "from app.main import app; print(app.title)"
          docker run --rm -e DATABASE_URL=sqlite+pysqlite:////tmp/ci.db insurio-api:ci alembic upgrade head

  docker-web:
    name: Docker frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t insurio-web:ci --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 ./frontend
      - name: Verify web image artifacts
        run: docker run --rm insurio-web:ci node -e "require('fs').accessSync('server.js'); console.log('standalone server present')"

  docker-compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-lint, backend-unit, backend-integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
