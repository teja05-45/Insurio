[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "S101",  # assert is expected in tests
    "B008",  # FastAPI dependency defaults are intentional
    "SIM105",  # explicit try/except is clearer around optional imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# S104: binding all interfaces is deployment configuration, not a hardcoded host.
# S105: the default secret is a development sentinel rejected at startup in production.
"app/core/config.py" = ["S104", "S105"]
# S105: token *type* labels are not passwords.
"app/core/security.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]
"alembic/*" = ["E501", "I001"]

[tool.pytest.ini_options]
# Run from backend/. `pythonpath = ["."]` puts the backend package root on
# sys.path for every invocation mode: bare `pytest` (the console script does
# not add the cwd) and `python -m pytest` (which does). Without this, pytest's
# prepend import mode only inserts backend/tests, so `import app` fails.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast tests that touch no HTTP layer or database",
    "integration: tests that exercise the API through TestClient and SQLite",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/ai/embeddings.py"]
